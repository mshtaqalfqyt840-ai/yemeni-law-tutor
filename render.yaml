services:
  # ── 1. الخادم الخلفي (FastAPI & RAG Backend) ──
  - type: web
    name: yemeni-law-tutor-api
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
      - key: PYTHONUNBUFFERED
        value: "1"

  # ── 2. الواجهة الأمامية (React & Vite Frontend) ──
  - type: web
    name: yemeni-law-tutor-app
    runtime: static
    plan: free
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "./frontend/dist"
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: yemeni-law-tutor-api
          property: url
